name: Get-ARM64-Docker-Images-Release

  on:
    workflow_dispatch:
      inputs:
        docker_images:
          description: '请填写docker镜像名称，多个用英文逗号分开'
          required: true
          default: 'busybox:latest'

  permissions:
    contents: write

  jobs:
    pull_and_package:
      runs-on: ubuntu-22.04
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Pull Docker Images and Package
          run: |
            images="${{ github.event.inputs.docker_
            IFS=',' read -r -a image_array <<< "$images"
            for image in "${image_array[@]}"; do
              docker pull "${image}" --platform "linux/arm64"
              image_name="${image//\//_}"
              image_name="${image_name//:/_}"
              docker save "${image}" -o "${image_na
              gzip -c "${image_name}-arm64.tar" > "4.tar.gz"
              rm "${image_name}-arm64.tar"
            done

        - name: List generated files (debug step)
          run: |
            echo "Preparing docker images list (.ta
            find $GITHUB_WORKSPACE -name "*.tar.gz"
            release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
            echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV

        - name: Create GitHub Release
          uses: softprops/action-gh-release@master
          with:
            tag_name: DockerTarBuilder-ARM64
            name: ${{ env.RELEASE_NAME }} for ARM64
            body: |
              ### How to use? For example
              `ctr image import busybox_latest-arm6
            draft: false
            prerelease: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Upload Docker images as release ass
          uses: softprops/action-gh-release@v2.1.0
          with:
            tag_name: DockerTarBuilder-ARM64
            files: ${{ github.workspace }}/*.tar.gz
            token: ${{ secrets.GITHUB_TOKEN }}
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
