 name: Download virtiofsd ARM64

  on:
    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    download:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Download virtiofsd release
          run: |
            # 下载最新版 virtiofsd aarch64 静态编译版
            wget https://gitlab.com/virtio-fs/virtiofsd/-/releases/v1.13.0/downloads/virtiofsd-v1.13.0-aarch64.zip

            # 解压
            unzip virtiofsd-v1.13.0-aarch64.zip

            # 查看文件
            ls -lh virtiofsd*

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: virtiofsd-arm64
            name: virtiofsd ARM64 Binary
            files: virtiofsd
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
